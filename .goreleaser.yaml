# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: opensearch-proxy

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: opensearch-proxy
    main: ./cmd
    binary: opensearch-proxy
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

# Signs and notarizes the darwin binaries with quill (runs on any OS). Skipped when the Apple secrets are not set.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - opensearch-proxy
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

release:
  github:
    owner: MDS-BD
    name: opensearch-proxy

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: opensearch-proxy
    binaries:
      - opensearch-proxy
    homepage: https://github.com/MDS-BD/opensearch-proxy
    description: SSM-tunnelled, SigV4-signing proxy to a private AWS OpenSearch domain
    repository:
      owner: MDS-BD
      name: homebrew-tools
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    # Release assets live in a private repo: download them through the GitHub API with HOMEBREW_GITHUB_API_TOKEN.
    # Homebrew hides that variable while the cask loads, so it is read by the strategy at download time.
    url:
      template: "https://github.com/MDS-BD/opensearch-proxy/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
      using: GitHubPrivateRepositoryReleaseDownloadStrategy
    custom_block: |
      require "download_strategy"

      class GitHubPrivateRepositoryReleaseDownloadStrategy < CurlDownloadStrategy
        def initialize(url, name, version, **meta)
          @url = url
          parse_url_pattern
          set_github_token
          meta[:headers] ||= []
          meta[:headers] << "Accept: application/octet-stream"
          meta[:headers] << "Authorization: Bearer #{@github_token}"
          super("https://api.github.com/repos/#{@owner}/#{@repo}/releases/assets/#{asset_id}", name, version, **meta)
        end

        def parse_url_pattern
          url_pattern = %r{https://github.com/([^/]+)/([^/]+)/releases/download/([^/]+)/(\S+)}
          raise CurlDownloadStrategyError, "Invalid url pattern" unless @url =~ url_pattern

          _, @owner, @repo, @tag, @filename = *@url.match(url_pattern)
        end

        private

        def set_github_token
          @github_token = ENV["HOMEBREW_GITHUB_API_TOKEN"]
          raise CurlDownloadStrategyError, "HOMEBREW_GITHUB_API_TOKEN is required." unless @github_token
        end

        def asset_id
          @asset_id ||= GitHub.get_release(@owner, @repo, @tag)["assets"]
                              .find { |a| a["name"] == @filename }
                              .fetch("id") { raise CurlDownloadStrategyError, "Asset not found" }
        end
      end
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "feat: {{ .ProjectName }} {{ .Tag }}"
    # Unsigned builds (no Apple secrets) get quarantined by Gatekeeper: strip the flag. Harmless once notarized.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/opensearch-proxy"]
          end
