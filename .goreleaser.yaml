# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: aws-tunnel

before:
  hooks:
    - go mod verify
    - go test -mod=readonly ./...

builds:
  - id: aws-tunnel
    main: ./cmd
    binary: aws-tunnel
    env:
      - CGO_ENABLED=0
      - GOFLAGS=-mod=readonly
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

# Signs and notarizes the darwin binaries with quill (runs on any OS). Skipped when the Apple secrets are not set.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - aws-tunnel
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        # Optional: a .p12 exported without a password needs no MACOS_SIGN_PASSWORD secret.
        password: '{{ envOrDefault "MACOS_SIGN_PASSWORD" "" }}'
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - THIRD-PARTY-NOTICES
      - LICENSES/**

release:
  github:
    owner: MDS-BD
    name: aws-tunnel

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: aws-tunnel
    binaries:
      - aws-tunnel
    homepage: https://github.com/MDS-BD/aws-tunnel
    description: SSM tunnels to private AWS services (OpenSearch, ...) without bastions or plugins
    repository:
      owner: MDS-BD
      name: homebrew-tools
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    url:
      template: "https://github.com/MDS-BD/aws-tunnel/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "feat: {{ .ProjectName }} {{ .Tag }}"
    # Unsigned builds (no Apple secrets) get quarantined by Gatekeeper: strip the flag. Harmless once notarized.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/aws-tunnel"]
          end
